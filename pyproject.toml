# Generated by tools/bundle.py from breadcrumbs-hermes, breadcrumbs-common and breadcrumbs-spacegraph
# (see BUNDLE.json). One dependency: google-crc32c, so the CRC32C uses the CPU instruction (CPython only;
# GraalPy runs the pure loop). The layers are under lib/. With a [build-system] table or an extra, Hermes
# would also build the plugin itself into its environment, so this file declares neither.
[project]
name = "breadcrumbs"
version = "0.5.0"
description = "Content-addressed breadcrumb memory for Hermes: exact provenance, zoom levels 0..1, steady-state context."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["google-crc32c>=1.5,<2; platform_python_implementation == 'CPython'"]

[tool.setuptools]
packages = ["breadcrumbs_hermes"]

[tool.setuptools.package-data]
breadcrumbs_hermes = ["skills/*/SKILL.md"]
