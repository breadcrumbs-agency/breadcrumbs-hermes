<!doctype html>
<html><head><meta charset="utf-8"><title>breadcrumbs</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--fg:#e6e6ea;--dim:#8a8a94;--accent:#5b9cff;
  --panel:#111114;--card:#151519;--line:#24242a;--line2:#34343c;--faint:#55555f;
  --sans:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
/* the chrome follows the session graph of opencode_spacegraph: a toolbar, a path row, a side panel */
#bar{position:fixed;top:0;left:0;right:0;height:42px;display:flex;align-items:center;gap:2px;padding:0 10px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#brand{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:12px;white-space:nowrap}
#brand b{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;
  background:linear-gradient(135deg,#5b9cff,#9b8cff)}
#brand b svg{width:13px;height:13px}  /* the mark: four crumbs that climb */
.tool{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;color:var(--dim);
  white-space:nowrap;user-select:none;border:1px solid transparent;cursor:pointer}
.tool:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.tool:has(input:checked){color:var(--fg);background:rgba(91,156,255,.13);border-color:rgba(91,156,255,.35)}
.tool input{display:none}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#lay{display:flex;gap:2px;margin-left:8px;padding-left:8px;border-left:1px solid var(--line)}
@media (max-width:1180px){#lay .tool span{display:none}}
#agent{margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f6c177;font-size:12px;padding-left:12px}
#agent:not(:empty)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#f6c177;
  box-shadow:0 0 8px #f6c177;margin-right:8px;vertical-align:1px}
#find{display:flex;align-items:center;gap:7px;height:28px;width:15em;padding:0 9px;margin-left:10px;flex:none;
  border:1px solid var(--line2);border-radius:7px;background:var(--bg);color:var(--dim)}
#find:focus-within{border-color:rgba(91,156,255,.6)}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit}
#trail{position:fixed;top:42px;left:0;right:0;height:30px;display:flex;align-items:center;padding:0 14px;z-index:4;
  border-bottom:1px solid var(--line);background:var(--bg);color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden}
#trail a{cursor:pointer;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#trail a:last-child{color:var(--fg)}#trail a:hover{color:var(--accent)}
#trail i{font-style:normal;color:var(--faint);padding:0 8px}
#trail{padding-right:470px}
#legend{position:fixed;top:42px;right:14px;height:30px;display:flex;align-items:center;gap:12px;z-index:4;font-size:11.5px;color:var(--dim)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
#msg{position:fixed;bottom:0;left:0;right:0;height:24px;line-height:24px;padding:0 14px;color:var(--dim);background:var(--panel);
  border-top:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:5}
#tip{position:fixed;pointer-events:none;padding:7px 9px;border:1px solid var(--line2);background:var(--card);border-radius:7px;
  display:none;max-width:64ch;white-space:pre-wrap;z-index:9;font:12px/1.45 var(--mono);box-shadow:0 8px 24px rgba(0,0,0,.45)}
canvas{display:block;width:100vw;height:100vh}
.kick{margin:14px 0 6px;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;flex:none;
  color:var(--fg);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tag::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.btn{height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--card)}
.btn:hover{border-color:rgba(91,156,255,.6)}
/* the side panel: the text of the crumb or the event that was picked */
#side{position:fixed;top:72px;right:0;width:380px;bottom:24px;display:none;flex-direction:column;z-index:4;
  background:var(--panel);border-left:1px solid var(--line)}
#side.on{display:flex}
#side header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
#side .x{margin-left:auto;width:24px;height:24px;border-radius:6px;color:var(--dim);text-align:center;font-size:16px;line-height:24px}
#side .x:hover{background:rgba(255,255,255,.06);color:var(--fg)}
#side h3{margin:0;padding:0 14px 10px;font:600 14px/1.35 var(--sans);border-bottom:1px solid var(--line)}
#sbody{flex:1;overflow:auto;padding:0 14px 14px}
#sbody pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.55 var(--mono);color:var(--fg)}
#sbody .note{margin-top:12px;color:#f6c177;font-size:12px}
#side footer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
/* the context box: the Gantt (crumbs by user turns) and the Venn (what the context held after one event) */
#ctx{position:fixed;left:0;right:0;bottom:24px;height:44vh;display:none;z-index:4;background:var(--panel);border-top:1px solid var(--line)}
#ctx.on{display:flex}
#gantt{flex:1;min-width:0;overflow:auto}
#venn{width:360px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:0 14px 14px}
.gh,.gr{display:grid}
.gh{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}
.gh>div{padding:9px 10px 8px;border-left:1px solid var(--line);min-width:0}
.gh .corner{position:sticky;left:0;z-index:1;background:var(--panel);border-left:0;display:flex;flex-direction:column;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.who{font-size:10.5px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.said{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:22px;padding:0 7px;border-radius:6px;font-size:11.5px;
  background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.chip b{font-weight:600;color:var(--c);white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip:hover{border-color:var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 28%,var(--card));border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.chip.cut{border-style:dashed}
.gr{border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer}
.gr:hover{background:rgba(255,255,255,.03)}
.gl{position:sticky;left:0;z-index:1;display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;background:var(--panel);min-width:0}
.gr:hover .gl{background:#17171b}
.gl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.gk{flex:none;width:44px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.track{position:relative;grid-column:2/-1}
.bar{position:absolute;top:3px;bottom:3px;border-radius:5px;padding:0 7px;display:flex;align-items:center;overflow:hidden;
  font:11px/1 var(--mono);white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.bar:hover{border-color:var(--fg)}
.bar.on{box-shadow:0 0 0 1.5px var(--fg)}
.cutline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#e64553;opacity:.85}
.vh{position:sticky;top:0;z-index:1;background:var(--panel);padding:2px 0 8px;border-bottom:1px solid var(--line)}
.what{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px}
.what span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh .note{margin-top:5px;color:#f6c177;font-size:12px}
.frame{margin-top:12px;padding:8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 7%,transparent)}
.frame header{display:flex;align-items:center;gap:6px;margin:0 2px 7px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.frame header i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{display:flex;gap:7px;align-items:flex-start;padding:6px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--card);min-width:0}
.card:hover{border-color:var(--accent)}
.card .k{flex:none;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;margin-top:1px;
  font:600 9.5px var(--sans);color:#0b0b0d;background:var(--c)}
.card .t{font:11.5px/1.35 var(--mono);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.empty{color:var(--dim);margin-top:14px}
/* the size of the context (ACE's ace.log): a line, candles, a pie and the totals; the toolbar's Size toggle shows it in place of the Gantt */
#ctx.trk{height:66vh}
#ctx.trk #gantt,#ctx.trk #venn{display:none}
#trk{display:none;flex:1;min-width:0;overflow:auto;padding:10px 14px 16px}
#ctx.trk #trk{display:block}
.tkh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.tkh h4{margin:0;font-size:13px;font-weight:600}
.tkh .sub{color:var(--dim);font-size:12px;min-width:0}
.pills{display:inline-flex;gap:4px}
.pill{height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line2);color:var(--dim);font-size:12px}
.pill:hover{border-color:var(--accent);color:var(--fg)}
.pill.on{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:var(--accent);color:var(--fg)}
.tkn{color:#f6c177;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-bottom:10px}
.tile{padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--card)}
.tile .v{font-size:20px;font-weight:600;line-height:1.15;font-variant-numeric:proportional-nums}
.tile .l{font-size:11px;color:var(--dim);margin-top:2px}
.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tk.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tk.c1{grid-template-columns:minmax(0,1fr)}
.pn{position:relative;padding:9px 12px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);min-width:0}
.pn.w2{grid-column:span 2}
.tk.c2 .pn.w2,.tk.c1 .pn.w2{grid-column:1/-1}
.pn h5{margin:0 0 1px;font-size:12px;font-weight:600}
.pn .s{color:var(--dim);font-size:11.5px;margin-bottom:6px}
.pn svg{display:block;max-width:100%;overflow:visible}
.pn text{font:11px var(--sans);fill:var(--dim)}
.pn text.v{fill:var(--fg)}
.key{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--dim);margin-top:4px}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:12px;height:2px;background:var(--c);border-radius:1px}
.key i.d{width:8px;height:8px;border-radius:50%}
.key i.b{width:8px;height:10px;border-radius:2px}
.key i.r{width:8px;height:8px;border-radius:50%;background:none;border:2px solid var(--c);box-sizing:border-box}
.tkt{position:absolute;display:none;pointer-events:none;z-index:5;padding:6px 8px;border:1px solid var(--line2);background:var(--panel);
  border-radius:7px;font-size:11.5px;line-height:1.4;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.tkt div:first-child{font-weight:600}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie table{border-collapse:collapse;font-size:11.5px}
.pie td{padding:2px 8px 2px 0}
.pie td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.pie td i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
.rowb{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;align-items:center;gap:6px;height:22px;cursor:pointer;border-radius:5px}
.rowb:hover{background:rgba(255,255,255,.04)}
.rowb.on{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.rowb .id{font:11px var(--mono);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowb .n{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.rowb .bar2{display:flex;gap:2px;height:10px}
.rowb .bar2 i{display:block;height:100%;background:var(--c);border-radius:0 3px 3px 0}
.tk details{margin-top:8px;font-size:11.5px;color:var(--dim)}
.tk table.tbl{border-collapse:collapse;margin-top:4px}
.tk table.tbl td,.tk table.tbl th{padding:1px 10px 1px 0;text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
.tk table.tbl th{color:var(--dim)}
</style></head><body>
<div id="bar">
  <div id="brand"><b><svg viewBox="0 0 58 58" aria-hidden="true"><g fill="#0b0b0d"><circle cx="12" cy="44" r="5"/><circle cx="26" cy="34" r="5"/><circle cx="38" cy="22" r="5.5"/><circle cx="48" cy="10" r="6"/></g></svg></b>breadcrumbs</div>
  <button class="tool" id="home" title="All sessions"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Overview</button>
  <label class="tool"><input type="checkbox" id="ctxon"><svg class="i" viewBox="0 0 16 16"><path d="M2 4h7M5 8h9M2 12h5"/></svg>Context</label>
  <label class="tool"><input type="checkbox" id="trkon"><svg class="i" viewBox="0 0 16 16"><path d="M2 13V3M2 13h12M4 10l3-3 2 2 4-5"/></svg>Size</label>
  <label class="tool"><input type="checkbox" id="follow"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>Follow the agent</label>
  <div id="lay"></div>
  <div id="agent"></div>
  <div id="find"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q" placeholder="Find in memory"></div>
</div>
<div id="trail"></div><div id="legend" title="The phase of each tool card, by tool name"></div>
<aside id="side"><header><span class="tag" id="skind"></span><button class="x" id="sclose" title="Close">&times;</button></header>
  <h3 id="stitle"></h3><div id="sbody"></div><footer><button class="btn" id="smap">Show in the map</button></footer></aside>
<div id="ctx"><div id="gantt"></div><div id="venn"></div><div id="trk"></div></div>
<div id="tip"></div><div id="msg"></div><canvas id="g"></canvas>
<script>
"use strict";
// The memory as a zoomable map. The design follows SpaceGraph (Graph2D, Force2D, Zoomed); no
// SpaceGraph code is used. A box is a crumb, sized by its token count. Sessions float in a force
// layout and pull together when they share cue words. A box that is large on the screen opens: its
// parts appear inside it, under its text. The camera zooms to a box, and a box shows
// crumb(id, level) at the level that its screen area can hold, so zooming in shows more of the same
// verbatim lines. The stack of zoomed boxes is the trail.
const HASH = new URLSearchParams(location.hash.slice(1)), ARG = new URLSearchParams(location.search);
const KEY = HASH.get("k") || ARG.get("k") || "";
for (const v of ["bg", "fg", "dim", "accent"]) if (ARG.get(v)) document.documentElement.style.setProperty("--" + v, ARG.get(v));
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
const KIND = {span: "#9b8cff", turn: "#4fd1c5", tool: "#94a3b8", sum: "#f6c177", mem: "#f38ba8", text: "#8892a6"};
const AGENT = "#f6c177";
const color = k => KIND[k] || (k in HUE ? hsl(HUE[k], 1, 66) : css("accent"));
function rgba(c, a) {
  let h = c.startsWith("#") ? c.slice(1) : "";
  if (h.length === 3) h = [...h].map(x => x + x).join("");
  if (h.length !== 6) return c;
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4), 16)},${a})`;
}
const api = (p, q = {}) => fetch("api/" + p + "?" + new URLSearchParams({...q, k: KEY}))
  .then(r => r.ok ? r.json() : Promise.reject(new Error(p + ": HTTP " + r.status)));
const $ = id => document.getElementById(id), cv = $("g"), g = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TOP = 72, LH = 15, FONT = "12px ui-monospace,SFMono-Regular,Menlo,monospace";
const SANS = "-apple-system,BlinkMacSystemFont,Inter,'Segoe UI',system-ui,sans-serif";
let BOTTOM = 24, RIGHT = 0;  // the status line and the context box; the side panel (set by resize)
const OPEN = 170;  // a box this many pixels wide shows its parts
let W = 1, H = 1, DPR = 1, CW = 7.2;
const msg = t => { $("msg").textContent = t; };

// -- the graph: a node is a crumb at one place; a part's key is its parent's key + ">" + its slot --
const nodes = new Map(), roots = [], cueEdges = [];
function node(info, key, parent) {
  const n = Object.assign({key, parent, kids: null, x: 0, y: 0, vx: 0, vy: 0, s: 40,
    texts: new Map(), asked: new Set(), glow: 0}, info);
  nodes.set(key, n);
  return n;
}
function addRoot(info) {
  if (nodes.has(info.id)) return nodes.get(info.id);
  const n = node(info, info.id, null), a = Math.random() * 2 * Math.PI;
  const d = (60 * Math.sqrt(roots.length + 1) + 80) * Math.sqrt(Math.random());
  n.x = Math.cos(a) * d; n.y = Math.sin(a) * d; n.s = 70 * (0.3 + 0.7 * (info.pri || 0.5));
  n.w = n.h = n.s; n.tx = n.x; n.ty = n.y; n.sub = [];  // its size now and its place in a fixed layout
  roots.push(n); temp = Math.max(temp, 0.5); dirty = true;
  return n;
}
function parts(n) {  // load the parts of a crumb once; resolves to the list of part keys
  if (!n.loading) n.loading = n.kind === "text" || n.id.includes(":") ? Promise.resolve(n.kids = [])
    : api("graph", {root: n.id}).then(r => {  // a crumb that holds only texts (a turn) shows its text, not a grid
      const kids = r.nodes.slice(1);
      return n.kids = kids.some(info => !info.id.includes(":")) ? kids.map((info, i) => node(info, `${n.key}>${i}.${info.id}`, n.key).key) : [];
    })
      .catch(err => { msg(err.message); return n.kids = []; });
  return n.loading;
}
function layoutKids(p) {  // the parts sit in a grid in the lower 60% of the box
  const pw = p.w || p.s, ph = p.h || p.s, m = p.kids.length, bw = pw * 0.94, bh = ph * 0.6, top = p.y - ph / 2 + ph * 0.37;
  const cols = Math.max(1, Math.ceil(Math.sqrt(m * bw / bh))), cell = Math.min(bw / cols, bh / Math.ceil(m / cols));
  const left = p.x - Math.min(cols, m) * cell / 2;
  let top1 = 1;
  for (const key of p.kids) top1 = Math.max(top1, nodes.get(key).tokens || 1);
  p.kids.forEach((key, i) => {
    const k = nodes.get(key), rel = (1 + Math.log1p(k.tokens || 1)) / (1 + Math.log1p(top1));
    k.x = left + (i % cols + 0.5) * cell; k.y = top + (Math.floor(i / cols) + 0.5) * cell;
    k.s = cell * (0.5 + 0.42 * rel);
    if (k.kids) layoutKids(k);
  });
}

// -- the session layout: a force model in the manner of SpaceGraph's Force2D ----------------------
// All pairs repel (inverse square), cue-word edges pull like springs, a weak pull to the centre keeps
// the map compact, and boxes never overlap. The temperature falls and rises when the graph changes.
const REPEL = 6, GRAVITY = 0.003, SPRING = 0.02, GAP = 26, LINK = 40;
let temp = 1;
function step() {

  box.append(s, keyRow([["no fold", TK.sent, "b"], ["a fold in this run", TK.fold, "b"], ["wick: high to low", "var(--dim)"], ["target", "var(--faint)"]]));
  const det = el("details"), tb = el("table", "tbl");
  det.append(el("summary", null, "Table"), tb);
  tb.append(Object.assign(el("tr"), {innerHTML: "<th>requests</th><th>open</th><th>high</th><th>low</th><th>close</th><th>folds</th>"}));
  for (const c of cs.slice(-12)) tb.append(Object.assign(el("tr"), {innerHTML: `<td>${c.i0 + 1}–${c.i1 + 1}</td><td>${c.open}</td><td>${c.high}</td><td>${c.low}</td><td>${c.close}</td><td>${acts(c)[0]}</td>`}));

}
// the pie: what the last request held, and the rest of the chat behind it
function pieChart(d) {
  const mix = d.mix, box = panel("", "What the last request held", "The pie is the whole chat so far, in tokens.");
  if (!mix) { box.append(el("div", "empty", "No request yet.")); return box; }
  const parts = [["fixed part (prompt, tools)", mix.base, TK.fixed], ["layer (crumbs)", mix.layer, TK.layer], ["exact turns", mix.exact, TK.exact], ["held back, one crumb call away", mix.held, "held"]];
  const total = parts.reduce((a, p) => a + p[1], 0) || 1, R = 66, C = 72, wrap = el("div", "pie");
  const s = sv("svg", {viewBox: `0 0 ${C * 2} ${C * 2}`, width: C * 2, height: C * 2, role: "img", "aria-label": "Share of the whole chat by part: " + parts.map(p => `${p[0]} ${pc(p[1] / total)}`).join(", ")});
  let a0 = -Math.PI / 2;

    let node;
    if (nz.length === 1) node = sv("circle", {cx: C, cy: C, r: R, fill, stroke: st, "stroke-width": 2});
    else {
      const a1 = a0 + v / total * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0;
      node = sv("path", {d: `M${C} ${C}L${C + R * Math.cos(a0)} ${C + R * Math.sin(a0)}A${R} ${R} 0 ${big} 1 ${C + R * Math.cos(a1)} ${C + R * Math.sin(a1)}Z`, fill, stroke: st, "stroke-width": 2, "stroke-linejoin": "round"});
      a0 = a1;
    }
    node.append(sv("title", {}, `${name}: ${v.toLocaleString()} tokens (${pc(v / total)})`)); s.append(node);
  }
  const tb = el("table");
  for (const [name, v, c] of parts) {
    const r = el("tr"), k = el("td"), i = el("i");
    i.style.setProperty("--c", c === "held" ? "rgba(138,138,148,.35)" : c); k.append(i, name);
    r.append(k, el("td", "n", kfmt(v)), el("td", "n", pc(v / total))); tb.append(r);
  }
  wrap.append(s, tb); box.append(wrap);
  box.append(el("div", "s", `Sent ${mix.sent.toLocaleString()} of ${mix.raw.toLocaleString()} tokens.` + (mix.unknown.length ? " Older lines do not log " + mix.unknown.join(" or ") + "." : "")));

}
// the cut sizes of every fold in the log: the design aims at about a tenth
function cutChart(d) {
  const a = d.all, box = panel("", "How hard folds cut", "Share of the request before that a fold removed, every session in the log.");
  const labels = ["< 5%", "5–10%", "10–20%", "20–40%", "40%+"], W = trkGrid().w(1), H = 150, m = {l: 26, r: 6, t: 16, b: 22};
  const {top: ymax, ticks} = nice(Math.max(1, ...a.bins) * 1.05, 3), y = v => H - m.b - v / ymax * (H - m.t - m.b);
  const s = sv("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "Folds by the share of the request that they cut: " + a.bins.map((b, i) => `${labels[i]} ${b}`).join(", ")});
  s.append(axes(W, H, m, ymax, ticks, y));
  const step = (W - m.l - m.r) / a.bins.length, bw = Math.min(24, step - 8), t = tip(box);
  a.bins.forEach((n, i) => {
    const cx = m.l + (i + .5) * step, col = i < 2 ? TK.sent : TK.fold, h = Math.max(n ? 2 : 0, y(0) - y(n));
    if (n) s.append(sv("path", {d: `M${cx - bw / 2} ${y(0)}V${y(0) - h + 4}Q${cx - bw / 2} ${y(0) - h} ${cx - bw / 2 + 4} ${y(0) - h}H${cx + bw / 2 - 4}Q${cx + bw / 2} ${y(0) - h} ${cx + bw / 2} ${y(0) - h + 4}V${y(0)}Z`, fill: col}));
    s.append(sv("text", {x: cx, y: y(0) - h - 4, "text-anchor": "middle", class: "v"}, n || ""), sv("text", {x: cx, y: H - 6, "text-anchor": "middle"}, labels[i]));
    const hit = sv("rect", {x: cx - step / 2, y: m.t, width: step, height: H - m.t - m.b, fill: "transparent"});
    hit.addEventListener("mousemove", e => { const bx = box.getBoundingClientRect(); t.show([`folds that cut ${labels[i]}`, `${n} of ${a.folds}`], e.clientX - bx.left, e.clientY - bx.top); });
    hit.addEventListener("mouseleave", () => t.hide()); s.append(hit);

  box.append(el("div", "s", a.median_cut == null ? "No fold yet." : `Median cut ${pc(a.median_cut)}. The first fold of a session has no gain measured yet and cuts more.`));

}
// the totals: how each session spent its requests
function sessionBars(d) {

    b.title = `${r.sess}\n${r.n} requests, ${r.folds} folds, largest ${r.max_sent.toLocaleString()} tokens\n${hms(r.t0)} – ${hms(r.t1)}`;
    for (const [act, c] of [["pass", TK.raw], ["keep", TK.sent], ["fold", TK.fold], ["ratchet", TK.fold]]) {
      const n = r.acts[act] || 0; if (!n) continue;
      const i = el("i"); i.style.cssText = `width:${n / mx * 100}%;--c:${c}` + (act === "ratchet" ? ";opacity:.55" : ""); bar.append(i);
    }
    b.append(el("span", "id", short6(r.sess)), bar, el("span", "n", r.n));
    b.onclick = () => { trkMode = "pin"; trkPin = r.sess; trkKey = ""; trk(); };
    box.append(b);

  box.append(keyRow([["pass", TK.raw, "b"], ["keep", TK.sent, "b"], ["fold", TK.fold, "b"], ["ratchet", "rgba(217,89,38,.55)", "b"]]));  // as the bars: a ratchet is the faded fold color
  const a = d.all;
  box.append(el("div", "s", `${a.requests} requests, ${a.folds} folds` + (a.cache_kept == null ? "" : `; ${pc(a.cache_kept)} of the requests after the first fold kept the layer`) + "."));

}
function tiles(d) {
  const pts = d.points, last = pts[pts.length - 1], cuts = pts.filter(p => p.act === "fold" && p.i).map(p => p.drop).sort((a, b) => a - b);
  const keeps = pts.filter(p => p.act === "keep").length, folds = pts.filter(p => p.act === "fold").length, t = el("div", "tiles");
  const add = (v, l) => { const x = el("div", "tile"); x.append(el("div", "v", v), el("div", "l", l)); t.append(x); };
  add(last ? kfmt(last.sent) : "–", last && last.target ? `sent now, ${pc(last.sent / last.target)} of the ${kfmt(last.target)} target` : "sent now");
  add(last ? kfmt(last.raw) : "–", "without ACE");
  add(folds, "folds in this session");
  add(cuts.length ? pc(cuts[Math.floor(cuts.length / 2)]) : "–", "median cut of a fold");
  add(keeps + folds ? pc(keeps / (keeps + folds)) : "–", "requests that kept the layer");

}
function drawTrk(d, note) {

    const b = el("button", "pill" + (trkMode === mode ? " on" : ""), name);

  }
  if (trkMode === "pin") pills.append(el("button", "pill on", short6(trkPin)));
  head.append(el("h4", null, "Context size"), pills, el("span", "sub", d.session ? `${d.session} · ${d.points.length} requests` + (d.session === d.current ? " · the current session" : "") : "ace.log has no request yet"));

const trkKeyOf = (d, note) => { const p = d.points[d.points.length - 1]; return [d.session, d.points.length, p ? p.ts : 0, d.all.requests, $("trk").clientWidth, trkMode, note].join(":"); };
function trkFit() {  // the window changed size: draw the last data again at the new width now (the 2 s timer would lag)

function trk() {
